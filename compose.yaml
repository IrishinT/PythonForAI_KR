services:
  api:
    build:
      context: .
      target: api
    environment:
      WEATHER_MASTER_KEY: "${WEATHER_MASTER_KEY:-}"
    volumes:
      - model-artifacts:/app/artifacts
      - backend-logs:/app/logs
    ports:
      - "${WEATHER_API_BIND:-127.0.0.1}:${WEATHER_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  bot:
    build:
      context: .
      target: bot
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}"
      WEATHER_API_URL: "http://api:8000"
      TELEGRAM_PROXY_URL: "${TELEGRAM_PROXY_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-artifacts:
  backend-logs:
